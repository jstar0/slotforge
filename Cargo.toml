[package]
name = "slotforge"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Deterministic capacity, idempotency, and fair waitlist engine"
license = "MIT"
readme = "README.md"
keywords = ["reservation", "waitlist", "scheduling", "fairness", "event-sourcing"]
categories = ["algorithms", "command-line-utilities"]

[dependencies]
axum = "0.8.0"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6.0", features = ["fs"] }

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "slotforge"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
